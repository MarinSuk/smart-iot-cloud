server:
  port: 8081

spring:
  application:
    name: iot-admin-api
  profiles:
    include: datasource # Load multi-datasource config / 引入多数据源配置

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# Knife4j / OpenAPI 3 configuration / 接口文档配置（供AI读取生成前端）
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs